name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is Vercel's default runtime; 3.14 is what .python-version pins.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # The suite stubs every upstream call, so no TMDB token is needed.
        run: python -m unittest discover -s tests -t . -v

      - name: Check both entrypoints import cleanly
        run: |
          python -c "import app; print('ASGI entrypoint:', type(app.app).__name__)"
          python -c "import server; print('MCP server imports OK')"
